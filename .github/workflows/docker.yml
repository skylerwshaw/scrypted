name: Release fork Docker image

on:
  push:
    tags: ["v*-fork.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (for example v0.144.2-fork.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-docker-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/scrypted

jobs:
  test-and-package:
    name: Test and package server source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release source and version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release commit must be on origin/main." >&2
            exit 1
          }
          server_version=$(jq -r .version server/package.json)
          expected_prefix="v${server_version}-fork."
          case "$REQUESTED_VERSION" in
            "$expected_prefix"[0-9]*) ;;
            *)
              echo "Version must match ${expected_prefix}<number>." >&2
              exit 1
              ;;
          esac
          suffix=${REQUESTED_VERSION#"$expected_prefix"}
          case "$suffix" in
            *[!0-9]*|'')
              echo "Fork release suffix must be a positive integer." >&2
              exit 1
              ;;
          esac
          test "$suffix" -gt 0
          echo "value=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install locked dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Pack tested server
        working-directory: server
        run: |
          mkdir -p ../install/docker/dist
          npm pack --pack-destination ../install/docker/dist
          mv ../install/docker/dist/scrypted-server-*.tgz ../install/docker/dist/scrypted-server.tgz

      - name: Upload tested server package
        uses: actions/upload-artifact@v6
        with:
          name: scrypted-server-${{ steps.version.outputs.value }}
          path: install/docker/dist/scrypted-server.tgz
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.test-and-package.outputs.version }}
    needs: test-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download tested server package
        uses: actions/download-artifact@v6
        with:
          name: scrypted-server-${{ needs.test-and-package.outputs.version }}
          path: install/docker/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish source-based image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.fork
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.test-and-package.outputs.version }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.test-and-package.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
